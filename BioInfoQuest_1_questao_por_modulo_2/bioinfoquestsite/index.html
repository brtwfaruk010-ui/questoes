<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioInfoQuest - Bioinformática Pedro Faruk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="light-theme">
    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="brand">
                <ion-icon name="dna-outline" class="brand-icon"></ion-icon>
                <h1>BioInfoQuest</h1>
            </div>
            <ul class="nav-links">
                <li class="active" data-route="dashboard">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Dashboard</span>
                </li>
                <li data-route="study">
                    <ion-icon name="book-outline"></ion-icon>
                    <span>Modo Estudo</span>
                </li>
                <li data-route="exam">
                    <ion-icon name="timer-outline"></ion-icon>
                    <span>Simulado</span>
                </li>
                <li data-route="review">
                    <ion-icon name="sync-outline"></ion-icon>
                    <span>Revisão</span>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="icon-btn">
                    <ion-icon name="moon-outline"></ion-icon>
                    <span>Modo Escuro</span>
                </button>
            </div>
        </nav>

        <main class="main-content">
            <div id="content-area"></div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/study.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/review.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
